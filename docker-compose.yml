services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: secure-commerce-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-secure_password}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - secure-commerce-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Redis for Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: secure-commerce-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_DOCKER_PASSWORD:-redis_password} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - secure-commerce-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Node.js Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secure-commerce-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-secure_password_change_me}@mongodb:27017/secure_commerce?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_DOCKER_PASSWORD:-redis_password}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-prod-access-secret-change-me}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-prod-refresh-secret-change-me}
      - FRONTEND_URL=http://localhost:3000
      - FRAUD_SERVICE_URL=http://fraud-service:8000
      - LOG_LEVEL=info
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - secure-commerce-network

  # Python Fraud Detection Service
  fraud-service:
    build:
      context: ./fraud-service
      dockerfile: Dockerfile
    container_name: secure-commerce-fraud
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_DOCKER_PASSWORD:-redis_password}
      MODEL_PATH: /app/models/fraud_model.pkl
      CONFIDENCE_THRESHOLD: ${FRAUD_THRESHOLD:-0.7}
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - secure-commerce-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: secure-commerce-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - secure-commerce-network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "picsum.photos:104.21.96.1"  # Direct IP mapping

networks:
  secure-commerce-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data: