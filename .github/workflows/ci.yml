name: SecureCommerce CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # =============================================
  # Backend Tests & Linting
  # =============================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint code
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --coverage
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-secret-key
          JWT_REFRESH_SECRET: test-refresh-secret
          MONGO_URI: mongodb://localhost:27017/test
          REDIS_HOST: localhost

      - name: Check formatting
        run: npx prettier --check 'src/**/*.ts'

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/

  # =============================================
  # Frontend Tests & Linting
  # =============================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test -- --coverage

      - name: Check formatting
        run: npx prettier --check 'src/**/*.{ts,tsx,css}'

      - name: Build application
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  # =============================================
  # Fraud Service Tests & Linting
  # =============================================
  fraud-service:
    name: Fraud Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fraud-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit black flake8

      - name: Lint with flake8
        run: flake8 app/ training/ tests/ --max-line-length=120 --ignore=E203,W503

      - name: Check formatting with black
        run: black --check app/ training/ tests/

      - name: Security scan with bandit
        run: bandit -r app/ -ll

      - name: Run tests
        run: pytest tests/ --cov=app --cov-report=xml --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: fraud-service-coverage
          path: fraud-service/htmlcov/

  # =============================================
  # Docker Build & Security Scan
  # =============================================
  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend, fraud-service]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: secure-commerce-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: secure-commerce-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build fraud service image
        uses: docker/build-push-action@v5
        with:
          context: ./fraud-service
          push: false
          load: true
          tags: secure-commerce-fraud:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-commerce-backend:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-commerce-frontend:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Scan fraud service image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-commerce-fraud:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # =============================================
  # Integration Tests (Optional)
  # =============================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend, fraud-service]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Start backend
        run: |
          cd backend
          npm run dev &
          sleep 10
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: mongodb://test:test@localhost:27017/test?authSource=admin
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: integration-test-secret
          JWT_REFRESH_SECRET: integration-test-refresh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install fraud service dependencies
        run: |
          cd fraud-service
          pip install -r requirements.txt

      - name: Start fraud service
        run: |
          cd fraud-service
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Run integration tests
        run: |
          # Health check backend
          curl -f http://localhost:5000/health || exit 1
          
          # Health check fraud service
          curl -f http://localhost:8000/health || exit 1
          
          # Test API endpoints
          curl -X POST http://localhost:5000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"test@test.com","password":"Test123!","firstName":"Test","lastName":"User"}' || exit 1
          
          echo "Integration tests passed!"

